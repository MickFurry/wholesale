{% extends "base.html" %}
{% set title = "Not found" %}

{% block content %}
  <section class="card">
    <div class="card-header">
      <h2>{{ kind }} not found</h2>
    </div>
    <p class="muted">No {{ kind|lower }} with id <code>{{ id }}</code>.</p>
    <p><a href="/" class="btn">Back to dashboard</a></p>
  </section>
{% endblock %}
